<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Zona de Comando</title>
    <style>
        body { background-color: #0d0f12; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1a1d21; padding: 30px; border-radius: 12px; border: 2px solid #00E676; box-shadow: 0 0 20px rgba(0, 230, 118, 0.2); }
        h1, h2 { color: #00E676; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #0d0f12; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: #00E676; outline: none; }
        button { background: #00E676; color: #0d0f12; border: none; padding: 14px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #00c853; }
        .btn-danger { background: #FF5252; margin-top: 20px; }
        .btn-danger:hover { background: #D50000; }
        .hidden { display: none; }
        #mensaje { text-align: center; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 6px; }
        hr { border-color: #333; margin: 30px 0; }
        .link-olvido { display: block; text-align: center; color: #888; margin-top: 15px; font-size: 13px; text-decoration: none; transition: 0.3s; }
        .link-olvido:hover { color: #00E676; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <h1>ZONA DE COMANDO</h1>
        <h2>Panel Administrativo</h2>

        <div id="loginSection">
            <p style="text-align: center; color: #888; margin-bottom: 25px;">Ingresa tus credenciales autorizadas.</p>
            <div class="form-group"><label>Correo Electrónico</label><input type="email" id="inEmail" placeholder="tu-correo@gmail.com"></div>
            <div class="form-group"><label>Contraseña</label><input type="password" id="inPassword" placeholder="••••••••"></div>
            <button id="btnLogin">Acceder al Sistema</button>
            <a href="#" id="btnOlvido" class="link-olvido">¿Olvidaste tu contraseña?</a>
            <p id="loginError" style="text-align: center; font-size: 14px; margin-top: 15px; color: #FF5252;"></p>
        </div>

        <div id="adminSection" class="hidden">
            <p id="txtAdminInfo" style="text-align: center; color: #00E676; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 15px;"></p>
            
            <!-- ENVIAR NOTIFICACIÓN PUSH GLOBAL -->
            <h3>📢 Enviar Notificación al Clan</h3>
            <div class="form-group">
                <label>Mensaje de la Notificación:</label>
                <input type="text" id="notifMensaje" placeholder="Ej: ¡Hay nuevas metas para multijugador!">
            </div>
            <button id="btnEnviarNotif">Enviar Notificación a la App</button>

            <hr>

            <h3>Actualizar Meta de Armas</h3>
            <div class="form-group">
                <select id="selCategoria">
                    <option value="warzone">Warzone</option>
                    <option value="multijugador">Multijugador</option>
                    <option value="endgame">Endgame</option>
                    <option value="ranked_warzone">Ranked Warzone</option>
                    <option value="ranked_multi">Ranked Multi</option>
                </select>
            </div>
            
            <h4 style="color: #aaa; margin-bottom: 5px; text-align: center;">FUSIL DE ASALTO</h4>
            <div class="form-group"><input type="text" id="fusilNombre" placeholder="Nombre (Ej: MCW)"></div>
            <div class="form-group"><input type="text" id="fusilCodigo" placeholder="Código / Accesorios"></div>
            <div class="form-group"><input type="text" id="fusilUrl" placeholder="URL de la imagen del fusil"></div>

            <h4 style="color: #aaa; margin-bottom: 5px; margin-top: 25px; text-align: center;">SUBFUSIL</h4>
            <div class="form-group"><input type="text" id="subfusilNombre" placeholder="Nombre (Ej: Striker)"></div>
            <div class="form-group"><input type="text" id="subfusilCodigo" placeholder="Código / Accesorios"></div>
            <div class="form-group"><input type="text" id="subfusilUrl" placeholder="URL de la imagen del subfusil"></div>

            <h4 style="color: #aaa; margin-bottom: 5px; margin-top: 25px; text-align: center;">FRANCOTIRADOR</h4>
            <div class="form-group"><input type="text" id="sniperNombre" placeholder="Nombre (Ej: KATT-AMR)"></div>
            <div class="form-group"><input type="text" id="sniperCodigo" placeholder="Código / Accesorios"></div>
            <div class="form-group"><input type="text" id="sniperUrl" placeholder="URL de la imagen del francotirador"></div>
            
            <button id="btnGuardarArmas">Guardar Meta Seleccionada</button>
            <hr>

            <h3>Actualizar Videos de la Comunidad</h3>
            <div class="form-group">
                <select id="selVideoSlot">
                    <option value="jugada_semana">Video Principal (Jugada de la Semana)</option>
                    <option value="galeria/video1">Video Secundario 1 (Galería)</option>
                    <option value="galeria/video2">Video Secundario 2 (Galería)</option>
                </select>
            </div>
            <div class="form-group"><input type="text" id="jugadaTitulo" placeholder="Ej: La mejor baja de la temporada"></div>
            <div class="form-group"><input type="text" id="jugadaUrl" placeholder="https://www.youtube.com/watch?v=..."></div>
            <button id="btnGuardarVideos">Publicar Video</button>
            <hr>

            <h3>Actualizar Enlaces (Navegación Interna)</h3>
            <div class="form-group"><label>URL Web - Noticias de la Semana:</label><input type="text" id="urlNoticias" placeholder="https://..."></div>
            <div class="form-group"><label>URL Web - Guías y Trucos:</label><input type="text" id="urlGuias" placeholder="https://..."></div>
            <button id="btnGuardarEnlaces">Guardar Enlaces</button>
            
            <p id="mensaje"></p>
            <button id="btnCerrarSesion" class="btn-danger">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCw2X2X8jk-zYIg23RNODKbk0mPHsvROmQ",
            authDomain: "zona-de-comando.firebaseapp.com",
            databaseURL: "https://zona-de-comando-default-rtdb.firebaseio.com",
            projectId: "zona-de-comando",
            storageBucket: "zona-de-comando.firebasestorage.app"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth(); const db = firebase.database();
        const loginSection = document.getElementById('loginSection'), adminSection = document.getElementById('adminSection');
        const btnLogin = document.getElementById('btnLogin'), btnCerrarSesion = document.getElementById('btnCerrarSesion');
        const loginError = document.getElementById('loginError'), txtAdminInfo = document.getElementById('txtAdminInfo'), mensaje = document.getElementById('mensaje');
        const btnOlvido = document.getElementById('btnOlvido');

        // INICIO DE SESIÓN
        btnLogin.addEventListener('click', () => {
            const e = document.getElementById('inEmail').value.trim(), p = document.getElementById('inPassword').value.trim();
            if(!e || !p) { loginError.style.color = "#FF5252"; loginError.innerText = "Ingresa datos."; return; }
            btnLogin.innerText = "Verificando..."; btnLogin.disabled = true;
            auth.signInWithEmailAndPassword(e, p).catch(() => { btnLogin.innerText = "Acceder al Sistema"; btnLogin.disabled = false; loginError.style.color = "#FF5252"; loginError.innerText = "Error en credenciales."; });
        });

        // RECUPERAR CONTRASEÑA
        btnOlvido.addEventListener('click', (e) => {
            e.preventDefault();
            const email = document.getElementById('inEmail').value.trim();
            if(!email) {
                loginError.style.color = "#FF5252";
                loginError.innerText = "Escribe tu correo arriba y presiona aquí de nuevo.";
                return;
            }
            auth.sendPasswordResetEmail(email).then(() => {
                loginError.style.color = "#00E676";
                loginError.innerText = "¡Enlace enviado! Revisa tu bandeja de entrada.";
                setTimeout(() => { loginError.innerText = ""; loginError.style.color = "#FF5252"; }, 6000);
            }).catch(err => {
                loginError.style.color = "#FF5252";
                loginError.innerText = "Error: Verifica que el correo esté bien escrito.";
            });
        });

        // CERRAR SESIÓN
        btnCerrarSesion.addEventListener('click', () => auth.signOut());
        
        // ESTADO DE AUTENTICACIÓN
        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref("Admins/" + user.uid).once("value").then(s => {
                    if (s.exists() && s.val() === true) {
                        loginSection.classList.add('hidden'); adminSection.classList.remove('hidden'); txtAdminInfo.innerText = "Operando como: " + user.email; document.getElementById('inEmail').value = ""; document.getElementById('inPassword').value = ""; loginError.innerText = ""; btnLogin.innerText = "Acceder al Sistema"; btnLogin.disabled = false;
                    } else { auth.signOut(); loginError.style.color = "#FF5252"; loginError.innerText = "ACCESO DENEGADO."; btnLogin.innerText = "Acceder al Sistema"; btnLogin.disabled = false; }
                });
            } else { 
                loginSection.classList.remove('hidden'); 
                adminSection.classList.add('hidden'); 
            }
        });

        function mostrarMensaje(texto, color) { mensaje.style.color = color; mensaje.style.border = "1px solid " + color; mensaje.innerText = texto; setTimeout(() => { mensaje.innerText = ""; mensaje.style.border = "none"; }, 5000); }

        // ENVIAR NOTIFICACIÓN GLOBAL
        document.getElementById('btnEnviarNotif').addEventListener('click', () => {
            const texto = document.getElementById('notifMensaje').value.trim();
            if(!texto) { mostrarMensaje("⚠️ Escribe un mensaje para la notificación.", "#FF5252"); return; }

            const notifData = { mensaje: texto, timestamp: firebase.database.ServerValue.TIMESTAMP };
            db.ref("Configuracion/NotificacionGlobal").set(notifData)
                .then(() => { mostrarMensaje("✔️ ¡Notificación enviada a toda la app!", "#00E676"); document.getElementById('notifMensaje').value = ""; })
                .catch(error => mostrarMensaje("❌ Error: " + error.message, "#FF5252"));
        });

        // GUARDAR METAS DE ARMAS
        document.getElementById('btnGuardarArmas').addEventListener('click', () => {
            const cat = document.getElementById('selCategoria').value;
            const updates = {};
            
            const fN = document.getElementById('fusilNombre').value.trim(), fC = document.getElementById('fusilCodigo').value.trim(), fU = document.getElementById('fusilUrl').value.trim();
            if(fN) updates.fusil_nombre = fN; if(fC) updates.fusil_codigo = fC; if(fU) updates.fusil_url = fU;

            const sN = document.getElementById('subfusilNombre').value.trim(), sC = document.getElementById('subfusilCodigo').value.trim(), sU = document.getElementById('subfusilUrl').value.trim();
            if(sN) updates.subfusil_nombre = sN; if(sC) updates.subfusil_codigo = sC; if(sU) updates.subfusil_url = sU;

            const snN = document.getElementById('sniperNombre').value.trim(), snC = document.getElementById('sniperCodigo').value.trim(), snU = document.getElementById('sniperUrl').value.trim();
            if(snN) updates.francotirador_nombre = snN; if(snC) updates.francotirador_codigo = snC; if(snU) updates.francotirador_url = snU;

            if(Object.keys(updates).length === 0) { mostrarMensaje("⚠️ Llena al menos un dato para actualizar", "#FF5252"); return; }

            db.ref("MetaArmas/" + cat).update(updates)
                .then(() => {
                    mostrarMensaje("✔️ Armas actualizadas correctamente", "#00E676");
                    document.getElementById('fusilNombre').value = ""; document.getElementById('fusilCodigo').value = ""; document.getElementById('fusilUrl').value = "";
                    document.getElementById('subfusilNombre').value = ""; document.getElementById('subfusilCodigo').value = ""; document.getElementById('subfusilUrl').value = "";
                    document.getElementById('sniperNombre').value = ""; document.getElementById('sniperCodigo').value = ""; document.getElementById('sniperUrl').value = "";
                })
                .catch(e => mostrarMensaje("❌ Error: " + e.message, "#FF5252"));
        });

        // GUARDAR VIDEOS
        document.getElementById('btnGuardarVideos').addEventListener('click', () => {
            const slot = document.getElementById('selVideoSlot').value, jTitulo = document.getElementById('jugadaTitulo').value.trim(), jUrl = document.getElementById('jugadaUrl').value.trim();
            if(!jTitulo || !jUrl) { mostrarMensaje("⚠️ Completa campos", "#FF5252"); return; }
            db.ref("VideosComunidad/" + slot).set({ titulo: jTitulo, url: jUrl }).then(() => mostrarMensaje("✔️ Video publicado", "#00E676")).catch(e => mostrarMensaje("❌ Error: " + e.message, "#FF5252"));
        });

        // GUARDAR ENLACES
        document.getElementById('btnGuardarEnlaces').addEventListener('click', () => {
            const uNoticias = document.getElementById('urlNoticias').value.trim(), uGuias = document.getElementById('urlGuias').value.trim();
            if(!uNoticias && !uGuias) { mostrarMensaje("⚠️ Escribe al menos un enlace.", "#FF5252"); return; }
            const updates = {};
            if(uNoticias) updates["Configuracion/link_noticias"] = uNoticias;
            if(uGuias) updates["Configuracion/link_guias"] = uGuias;
            db.ref().update(updates).then(() => { mostrarMensaje("✔️ Enlaces de la App actualizados.", "#00E676"); document.getElementById('urlNoticias').value = ""; document.getElementById('urlGuias').value = ""; }).catch(e => mostrarMensaje("❌ Error de permisos.", "#FF5252"));
        });
    </script>
</body>
</html>
