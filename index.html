<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Zona de Comando</title>
    <style>
        body { background-color: #0d0f12; color: #ffffff; font-family: Arial, sans-serif; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1a1d21; padding: 30px; border-radius: 12px; border: 2px solid #00E676; box-shadow: 0 0 20px rgba(0, 230, 118, 0.2); }
        h1, h2 { color: #00E676; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; }
        input, select { width: 100%; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #0d0f12; color: #fff; box-sizing: border-box; font-size: 14px; }
        input:focus, select:focus { border-color: #00E676; outline: none; }
        button { background: #00E676; color: #0d0f12; border: none; padding: 14px; width: 100%; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 16px; margin-top: 10px; transition: 0.3s; }
        button:hover { background: #00c853; }
        .btn-danger { background: #FF5252; margin-top: 20px; }
        .btn-danger:hover { background: #D50000; }
        .hidden { display: none; }
        #mensaje { text-align: center; margin-top: 15px; font-weight: bold; padding: 10px; border-radius: 6px; }
        .link-recuperar { display: block; text-align: center; margin-top: 15px; color: #00E676; cursor: pointer; font-size: 14px; text-decoration: underline; }
        .link-recuperar:hover { color: #ffffff; }
        hr { border-color: #333; margin: 30px 0; }
    </style>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>

    <div class="container">
        <h1>ZONA DE COMANDO</h1>
        <h2>Panel Administrativo</h2>

        <!-- SECCIÓN DE LOGIN -->
        <div id="loginSection">
            <p style="text-align: center; color: #888; margin-bottom: 25px;">Ingresa tus credenciales autorizadas.</p>
            
            <div class="form-group">
                <label>Correo Electrónico (Real)</label>
                <input type="email" id="inEmail" placeholder="tu-correo@gmail.com">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="inPassword" placeholder="••••••••">
            </div>

            <button id="btnLogin">Acceder al Sistema</button>
            <span class="link-recuperar" id="btnRecuperar">¿Olvidaste tu contraseña?</span>
            
            <p id="loginError" style="text-align: center; font-size: 14px; margin-top: 15px;"></p>
        </div>

        <!-- SECCIÓN DE FORMULARIOS -->
        <div id="adminSection" class="hidden">
            <p id="txtAdminInfo" style="text-align: center; color: #00E676; font-weight: bold; border-bottom: 1px solid #333; padding-bottom: 15px;"></p>
            
            <!-- 1. META DE ARMAS -->
            <h3>Actualizar Meta de Armas</h3>
            <div class="form-group">
                <label>Categoría del Juego:</label>
                <select id="selCategoria">
                    <option value="warzone">Warzone</option>
                    <option value="multijugador">Multijugador</option>
                    <option value="endgame">Endgame</option>
                    <option value="ranked_warzone">Ranked Warzone</option>
                    <option value="ranked_multi">Ranked Multi</option>
                </select>
            </div>
            <div class="form-group"><input type="text" id="fusilNombre" placeholder="Nombre del Arma (Ej: MCW)"></div>
            <div class="form-group"><input type="text" id="fusilCodigo" placeholder="Código / Accesorios"></div>
            <div class="form-group"><input type="text" id="fusilUrl" placeholder="URL de la imagen del arma"></div>
            <button id="btnGuardarArmas">Guardar Meta</button>

            <hr>

            <!-- 2. VIDEOS DE LA COMUNIDAD (3 ESPACIOS) -->
            <h3>Actualizar Videos de la Comunidad</h3>
            <div class="form-group">
                <label>Selecciona el espacio a actualizar:</label>
                <select id="selVideoSlot">
                    <option value="jugada_semana">Video Principal (Jugada de la Semana)</option>
                    <option value="galeria/video1">Video Secundario 1 (Galería)</option>
                    <option value="galeria/video2">Video Secundario 2 (Galería)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Título del Video:</label>
                <input type="text" id="jugadaTitulo" placeholder="Ej: La mejor baja de la temporada">
            </div>
            <div class="form-group">
                <label>Enlace de YouTube:</label>
                <input type="text" id="jugadaUrl" placeholder="https://www.youtube.com/watch?v=...">
            </div>
            <button id="btnGuardarVideos">Publicar Video</button>

            <hr>

            <!-- 3. ENLACES Y CONFIGURACIÓN -->
            <h3>Actualizar Enlaces de la App</h3>
            <div class="form-group">
                <label>Enlace de Noticias de la Semana:</label>
                <input type="text" id="urlNoticias" placeholder="URL web o de imagen para Noticias">
            </div>
            <div class="form-group">
                <label>Enlace de Guías:</label>
                <input type="text" id="urlGuias" placeholder="URL web o de imagen para Guías">
            </div>
            <button id="btnGuardarEnlaces">Guardar Enlaces</button>
            
            <p id="mensaje"></p>
            <button id="btnCerrarSesion" class="btn-danger">Cerrar Sesión</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCw2X2X8jk-zYIg23RNODKbk0mPHsvROmQ",
            authDomain: "zona-de-comando.firebaseapp.com",
            databaseURL: "https://zona-de-comando-default-rtdb.firebaseio.com",
            projectId: "zona-de-comando",
            storageBucket: "zona-de-comando.firebasestorage.app",
            messagingSenderId: "395464987840",
            appId: "1:395464987840:android:e80b1c15a39218eec70925"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.database();

        const loginSection = document.getElementById('loginSection');
        const adminSection = document.getElementById('adminSection');
        const btnLogin = document.getElementById('btnLogin');
        const btnRecuperar = document.getElementById('btnRecuperar');
        const btnCerrarSesion = document.getElementById('btnCerrarSesion');
        const inEmail = document.getElementById('inEmail');
        const inPassword = document.getElementById('inPassword');
        const loginError = document.getElementById('loginError');
        const txtAdminInfo = document.getElementById('txtAdminInfo');
        const mensaje = document.getElementById('mensaje');

        // INICIAR SESIÓN
        btnLogin.addEventListener('click', () => {
            const email = inEmail.value.trim();
            const password = inPassword.value.trim();
            
            if(!email || !password) {
                loginError.style.color = "#FF5252";
                loginError.innerText = "Por favor ingresa correo y contraseña.";
                return;
            }

            btnLogin.innerText = "Verificando...";
            btnLogin.disabled = true;

            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    btnLogin.innerText = "Acceder al Sistema";
                    btnLogin.disabled = false;
                    loginError.style.color = "#FF5252";
                    loginError.innerText = "Error: Verifica tus datos o tu conexión.";
                });
        });

        // RECUPERAR CONTRASEÑA
        btnRecuperar.addEventListener('click', () => {
            const email = inEmail.value.trim();
            if(!email) {
                loginError.style.color = "#FF5252";
                loginError.innerText = "Escribe tu correo arriba y haz clic aquí de nuevo.";
                return;
            }
            auth.sendPasswordResetEmail(email)
                .then(() => {
                    loginError.style.color = "#00E676";
                    loginError.innerText = "✔️ Correo de recuperación enviado. Revisa tu bandeja de entrada.";
                })
                .catch((error) => {
                    loginError.style.color = "#FF5252";
                    loginError.innerText = "Error: " + error.message;
                });
        });

        // CERRAR SESIÓN
        btnCerrarSesion.addEventListener('click', () => {
            auth.signOut();
        });

        // DETECTAR ESTADO DE SESIÓN
        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref("Admins/" + user.uid).once("value").then(snapshot => {
                    if (snapshot.exists() && snapshot.val() === true) {
                        loginSection.classList.add('hidden');
                        adminSection.classList.remove('hidden');
                        txtAdminInfo.innerText = "Operando como: " + user.email;
                        inEmail.value = "";
                        inPassword.value = "";
                        btnLogin.innerText = "Acceder al Sistema";
                        btnLogin.disabled = false;
                        loginError.innerText = "";
                    } else {
                        auth.signOut();
                        loginError.style.color = "#FF5252";
                        loginError.innerText = "ACCESO DENEGADO: No eres administrador.";
                        btnLogin.innerText = "Acceder al Sistema";
                        btnLogin.disabled = false;
                    }
                }).catch(error => {
                    auth.signOut();
                    loginError.style.color = "#FF5252";
                    loginError.innerText = "Error de Base de Datos: " + error.message;
                    btnLogin.innerText = "Acceder al Sistema";
                    btnLogin.disabled = false;
                });
            } else {
                loginSection.classList.remove('hidden');
                adminSection.classList.add('hidden');
                mensaje.innerText = "";
            }
        });

        // SISTEMA DE MENSAJES EN PANTALLA
        function mostrarMensaje(texto, color) {
            mensaje.style.color = color;
            mensaje.style.background = "#121519";
            mensaje.style.border = "1px solid " + color;
            mensaje.innerText = texto;
            setTimeout(() => { mensaje.innerText = ""; mensaje.style.background = "transparent"; mensaje.style.border = "none"; }, 5000);
        }

        // GUARDAR ARMAS
        document.getElementById('btnGuardarArmas').addEventListener('click', () => {
            const cat = document.getElementById('selCategoria').value;
            const fNombre = document.getElementById('fusilNombre').value.trim();
            const fCodigo = document.getElementById('fusilCodigo').value.trim();
            const fUrl = document.getElementById('fusilUrl').value.trim();

            if(!fNombre || !fCodigo || !fUrl) {
                mostrarMensaje("⚠️ Completa todos los campos del arma.", "#FF5252");
                return;
            }

            db.ref("MetaArmas/" + cat).update({ fusil_nombre: fNombre, fusil_codigo: fCodigo, fusil_url: fUrl })
                .then(() => {
                    mostrarMensaje("✔️ Meta guardada correctamente.", "#00E676");
                    document.getElementById('fusilNombre').value = "";
                    document.getElementById('fusilCodigo').value = "";
                    document.getElementById('fusilUrl').value = "";
                })
                .catch(error => mostrarMensaje("❌ Error: " + error.message, "#FF5252"));
        });

        // GUARDAR VIDEOS
        document.getElementById('btnGuardarVideos').addEventListener('click', () => {
            const slot = document.getElementById('selVideoSlot').value;
            const jTitulo = document.getElementById('jugadaTitulo').value.trim();
            const jUrl = document.getElementById('jugadaUrl').value.trim();

            if(!jTitulo || !jUrl) {
                mostrarMensaje("⚠️ Completa los campos del video.", "#FF5252");
                return;
            }

            db.ref("VideosComunidad/" + slot).set({ titulo: jTitulo, url: jUrl })
                .then(() => {
                    mostrarMensaje("✔️ Video publicado correctamente en: " + slot, "#00E676");
                    document.getElementById('jugadaTitulo').value = "";
                    document.getElementById('jugadaUrl').value = "";
                })
                .catch(error => mostrarMensaje("❌ Error: " + error.message, "#FF5252"));
        });

        // GUARDAR ENLACES DE GUÍAS Y NOTICIAS
        document.getElementById('btnGuardarEnlaces').addEventListener('click', () => {
            const uNoticias = document.getElementById('urlNoticias').value.trim();
            const uGuias = document.getElementById('urlGuias').value.trim();

            if(!uNoticias && !uGuias) {
                mostrarMensaje("⚠️ Escribe al menos un enlace para actualizar.", "#FF5252");
                return;
            }

            const updates = {};
            if(uNoticias) updates["Configuracion/BannerConfig/noticias"] = uNoticias;
            if(uGuias) updates["Configuracion/BannerConfig/guias"] = uGuias;

            db.ref().update(updates)
                .then(() => {
                    mostrarMensaje("✔️ Enlaces de la App actualizados con éxito.", "#00E676");
                    document.getElementById('urlNoticias').value = "";
                    document.getElementById('urlGuias').value = "";
                })
                .catch(error => mostrarMensaje("❌ Error de permisos. Revisa la regla 'Configuracion' en Firebase.", "#FF5252"));
        });
    </script>
</body>
</html>
